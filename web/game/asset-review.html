<!doctype html><html><head><meta charset="utf-8"><title>Fighter asset review</title><style>body{margin:0;background:#17202c;color:white;font:16px system-ui}header{position:absolute;padding:16px}select,button{padding:8px}canvas{display:block}</style></head><body><header><strong>Asset review</strong> <select id="clip" aria-label="Animation"></select> <button id="pause">Pause</button><p id="status">Loading…</p></header><script type="module">
import * as T from './src/vendor/three.module.js';
const scene=new T.Scene(); scene.background=new T.Color('#17202c');
scene.add(new T.HemisphereLight(0xffffff,0x536078,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,5,5);scene.add(light);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1.2,5);camera.lookAt(0,1,0);
scene.add(new T.GridHelper(10,20));
const status=document.querySelector('#status'),select=document.querySelector('#clip');
let paused=false;document.querySelector('#pause').onclick=()=>paused=!paused;
try{const url=new URLSearchParams(location.search).get('asset')||'fighters/officer_flock/model.json';const model=await new T.ObjectLoader().loadAsync(url);model.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(model);const size=bounds.getSize(new T.Vector3());model.scale.multiplyScalar(1.92/size.y);model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model);const center=box.getCenter(new T.Vector3());model.position.add(new T.Vector3(-center.x,-box.min.y,-center.z));scene.add(model);const mixer=new T.AnimationMixer(model);let action;select.add(new Option('Rest pose',''));for(const c of model.animations)select.add(new Option(c.name,c.name));select.onchange=()=>{mixer.stopAllAction();if(select.value)action=mixer.clipAction(model.animations.find(c=>c.name===select.value)).play();};status.textContent=`Loaded · ${model.animations.length} animations · drag to rotate`;let drag=false,last=0;renderer.domElement.onpointerdown=e=>{drag=true;last=e.clientX};window.onpointerup=()=>drag=false;window.onpointermove=e=>{if(drag){model.rotation.y+=(e.clientX-last)*.01;last=e.clientX}};const clock=new T.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(!paused)mixer.update(Math.min(dt,.05));renderer.render(scene,camera)});}catch(e){status.textContent=e.stack;}
</script></body></html>
